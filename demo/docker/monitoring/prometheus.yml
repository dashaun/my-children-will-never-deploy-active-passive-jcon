global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gf1-locator'
    static_configs:
      - targets: ['gf1-locator:7777']
        labels:
          cluster: 'cluster1'
          member_type: 'locator'
          member: 'gf1-locator'

  - job_name: 'gf1-server'
    static_configs:
      - targets: ['gf1-server:7777']
        labels:
          cluster: 'cluster1'
          member_type: 'server'
          member: 'gf1-server'

  - job_name: 'gf2-locator'
    static_configs:
      - targets: ['gf2-locator:7777']
        labels:
          cluster: 'cluster2'
          member_type: 'locator'
          member: 'gf2-locator'

  - job_name: 'gf2-server'
    static_configs:
      - targets: ['gf2-server:7777']
        labels:
          cluster: 'cluster2'
          member_type: 'server'
          member: 'gf2-server'

  - job_name: 'gf3-locator'
    static_configs:
      - targets: ['gf3-locator:7777']
        labels:
          cluster: 'cluster3'
          member_type: 'locator'
          member: 'gf3-locator'

  - job_name: 'gf3-server'
    static_configs:
      - targets: ['gf3-server:7777']
        labels:
          cluster: 'cluster3'
          member_type: 'server'
          member: 'gf3-server'

  - job_name: 'gf4-locator'
    static_configs:
      - targets: ['gf4-locator:7777']
        labels:
          cluster: 'cluster4'
          member_type: 'locator'
          member: 'gf4-locator'

  - job_name: 'gf4-server'
    static_configs:
      - targets: ['gf4-server:7777']
        labels:
          cluster: 'cluster4'
          member_type: 'server'
          member: 'gf4-server'

  - job_name: 'gf5-locator'
    static_configs:
      - targets: ['gf5-locator:7777']
        labels:
          cluster: 'cluster5'
          member_type: 'locator'
          member: 'gf5-locator'

  - job_name: 'gf5-server'
    static_configs:
      - targets: ['gf5-server:7777']
        labels:
          cluster: 'cluster5'
          member_type: 'server'
          member: 'gf5-server'

  # The global load balancer (Spring Cloud Gateway): writes per region, failovers
  - job_name: 'publish-app'
    scrape_interval: 2s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          app: 'gateway'

  # One regional app per region
  - job_name: 'regional-apps'
    scrape_interval: 5s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8082', 'host.docker.internal:8083', 'host.docker.internal:8084', 'host.docker.internal:8085']
        labels:
          app: 'publish'
