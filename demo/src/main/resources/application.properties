spring.application.name=publish

# One regional deployment of the app. ./world starts five copies of this jar,
# overriding these three values per region (8081-8085 → 7071-7075).
server.port=8081
region.name=region1
region.gemfire-url=http://localhost:7071

# The global load balancer health-checks /actuator/health (includes the local grid)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
